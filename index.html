  });
  wrap.appendChild(grid);

  const startBtn = el("button", { class: "btn-primary", onclick: () => { state.newTopicDraft.step = 1; state.view = "new"; render(); } }, "+ Start a new topic");
  wrap.appendChild(startBtn);

  const aboutLink = el("a", { href: "#", style: "display:block;text-align:center;margin-top:14px;font-family:-apple-system,sans-serif;font-size:12.5px;color:var(--moss);" }, "What makes this different?");
  aboutLink.addEventListener("click", (e) => { e.preventDefault(); state.view = "intro"; render(); });
  wrap.appendChild(aboutLink);

  return wrap;
}

function NewTopicView() {
  const wrap = document.createDocumentFragment();
  const step = state.newTopicDraft.step || 1;
  const totalSteps = 4;

  wrap.appendChild(el("span", { class: "backlink", onclick: () => {
    if (step > 1) { state.newTopicDraft.step = step - 1; render(); }
    else { state.view = "home"; render(); }
  } }, "← Back"));

  const stepper = el("div", { style: "font-family:-apple-system,sans-serif;font-size:12px;color:#8a8578;margin-bottom:10px;" }, `Step ${step} of ${totalSteps}`);
  wrap.appendChild(stepper);

  const box = el("div", { class: "new-topic-box" });

  if (step === 1) {
    box.appendChild(el("h2", {}, "What do you want to learn?"));
    const inputWrap = el("div", { style: "position:relative;" });
    const input = el("input", { type: "text", placeholder: "e.g. Comparative religion, Roman history, guitar...", autocomplete: "off" });
    input.value = state.newTopicDraft.title;
    const suggestBox = el("div", { class: "autocomplete-box" });
    inputWrap.appendChild(input);
    inputWrap.appendChild(suggestBox);

    let debounceTimer;
    input.addEventListener("input", e => {
      state.newTopicDraft.title = e.target.value;
      clearTimeout(debounceTimer);
      const q = e.target.value.trim();
      if (q.length < 2) { suggestBox.innerHTML = ""; return; }
      debounceTimer = setTimeout(async () => {
        const suggestions = await fetchTopicSuggestions(q);
        suggestBox.innerHTML = "";
        suggestions.forEach(s => {
          const item = el("div", { class: "autocomplete-item" }, s);
          item.addEventListener("mousedown", () => { // mousedown fires before input blur
            state.newTopicDraft.title = s;
            input.value = s;
            suggestBox.innerHTML = "";
          });
          suggestBox.appendChild(item);
        });
      }, 300); // debounce so we're not firing a request on every keystroke
    });
    input.addEventListener("blur", () => setTimeout(() => { suggestBox.innerHTML = ""; }, 150));
    box.appendChild(inputWrap);
    const row = el("div", { class: "row" });
    const next = el("button", { class: "btn-primary" }, "Next");
    next.addEventListener("click", () => {
      if (!state.newTopicDraft.title.trim()) return;
      state.newTopicDraft.step = 2; render();
    });
    row.appendChild(next);
    box.appendChild(row);

  } else if (step === 2) {
    box.appendChild(el("h2", {}, `How familiar are you with ${state.newTopicDraft.title}?`));
    const levels = ["Never heard of it", "Beginner", "Intermediate", "Advanced", "Expert"];
    const levelGroup = el("div", { class: "chip-group" });
    levels.forEach(lv => {
      const chip = el("div", { class: "chip" + (state.newTopicDraft.level === lv ? " selected" : ""), onclick: () => { state.newTopicDraft.level = lv; render(); } }, lv);
      levelGroup.appendChild(chip);
    });
    box.appendChild(levelGroup);
    const row = el("div", { class: "row" });
    const next = el("button", { class: "btn-primary" }, "Next");
    next.addEventListener("click", () => { state.newTopicDraft.step = 3; render(); });
    row.appendChild(next);
    box.appendChild(row);

  } else if (step === 3) {
    box.appendChild(el("h2", {}, "How do you learn best?"));
    const styles = ["stories", "examples", "analogies", "practical", "project-based", "visuals"];
    const styleGroup = el("div", { class: "chip-group" });
    styles.forEach(s => {
      const chip = el("div", { class: "chip" + (state.newTopicDraft.style === s ? " selected" : ""), onclick: () => { state.newTopicDraft.style = s; render(); } }, s);
      styleGroup.appendChild(chip);
    });
    box.appendChild(styleGroup);
    box.appendChild(el("label", { class: "field-label" }, "Your country (optional — tailors examples & illustrations)"));
    const countryInput = el("input", { type: "text", placeholder: "e.g. India, Nigeria, Brazil..." });
    countryInput.value = state.newTopicDraft.country;
    countryInput.addEventListener("input", e => { state.newTopicDraft.country = e.target.value; });
    box.appendChild(countryInput);
    const row = el("div", { class: "row" });
    const next = el("button", { class: "btn-primary" }, "Next");
    next.addEventListener("click", () => { state.newTopicDraft.step = 4; render(); });
    row.appendChild(next);
    box.appendChild(row);

  } else if (step === 4) {
    box.appendChild(el("h2", {}, "Ready to build your curriculum"));
    const d = state.newTopicDraft;
    const summary = el("div", { style: "font-family:-apple-system,sans-serif;font-size:14px;color:#4a463c;line-height:1.8;margin-bottom:16px;" }, [
      el("div", {}, `📚 Topic: ${d.title}`),
      el("div", {}, `🎯 Level: ${d.level}`),
      el("div", {}, `🎨 Style: ${d.style}`),
      d.country ? el("div", {}, `🌍 Examples from: ${d.country}`) : null
    ]);
    box.appendChild(summary);
    const row = el("div", { class: "row" });
    const genBtn = el("button", { class: "btn-primary" }, "Generate curriculum");
    genBtn.disabled = state.loading;
    genBtn.addEventListener("click", generateCurriculum);
    row.appendChild(genBtn);
    box.appendChild(row);
  }

  wrap.appendChild(box);
  return wrap;
}

function CurriculumView() {
  const wrap = document.createDocumentFragment();
  const topic = state.topics[state.activeTopicId];
  if (!topic) { state.view = "home"; return wrap; }

  wrap.appendChild(el("span", { class: "backlink", onclick: () => { state.view = "home"; render(); } }, "← All topics"));
  wrap.appendChild(el("h2", { class: "curric-title" }, topicIcon(topic.title) + "  " + topic.title));
  wrap.appendChild(el("div", { class: "meta", style: "font-family:-apple-system,sans-serif;font-size:13px;color:#8a8578;" }, `${topic.level} · ${topic.style} style${topic.country ? " · " + topic.country + " examples" : ""} · ${topicProgress(topic)}% complete`));

  const list = el("div", { class: "lesson-list" });
  topic.lessons.forEach((lesson, idx) => {
    const unlocked = isLessonUnlocked(topic, lesson);
    const classes = "lesson-row" + (lesson.done ? " done" : "") + (!unlocked && !lesson.done ? " locked" : "");
    let row;
    if (lesson.skipped && !lesson.done) {
      row = el("div", { class: classes, onclick: () => openLesson(topic.id, idx) }, [
        el("div", { class: "lesson-num", style: "opacity:0.6;" }, "⤼"),
        el("div", {}, [
          el("div", { style: "opacity:0.7;" }, lesson.title),
          el("div", { style: "font-family:-apple-system,sans-serif;font-size:11px;color:#8a8578;margin-top:2px;" }, "Skipped — tap to come back to it anytime")
        ])
      ]);
    } else if (unlocked || lesson.done) {
      row = el("div", { class: classes, onclick: () => openLesson(topic.id, idx) }, [
        el("div", { class: "lesson-num" }, lesson.done ? "✓" : String(idx+1)),
        el("div", {}, lesson.title)
      ]);
    } else {
      const prereqTitles = (lesson.prerequisites || [])
        .map(pid => topic.lessons.find(l => l.id === pid))
        .filter(p => p && !p.done && !p.skipped)
        .map(p => p.title);
      const rowContent = el("div", { style: "flex:1;" }, [
        el("div", {}, lesson.title),
        prereqTitles.length ? el("div", { style: "font-family:-apple-system,sans-serif;font-size:11px;color:#8a8578;margin-top:2px;" }, "Unlocks after: " + prereqTitles.join(", ")) : null
      ]);
      const openAnywayBtn = el("button", { class: "btn-ghost", style: "font-size:11px;padding:5px 9px;flex-shrink:0;" }, "Open anyway");
      openAnywayBtn.addEventListener("click", (e) => { e.stopPropagation(); openLesson(topic.id, idx); }); // locked is a recommendation, not a hard block — learner stays in control
      row = el("div", { class: classes, style: "cursor:default;" }, [
        el("div", { class: "lesson-num" }, "🔒"),
        rowContent,
        openAnywayBtn
      ]);
    }
    list.appendChild(row);
  });

  // Proactive skip-ahead suggestion for strong performers — shown above the list so
  // it's the first thing noticed, but easy to dismiss and never nags about the same pair twice.
  const skipSuggestion = findSkipAheadSuggestion(topic);
  if (skipSuggestion) {
    const card = el("div", { class: "new-topic-box", style: "margin-bottom:14px;border-color:var(--moss);" }, [
      el("div", { style: "font-family:-apple-system,sans-serif;font-size:13px;line-height:1.5;margin-bottom:10px;" },
        `⚡ You've been getting these right — want to skip "${skipSuggestion.skip.title}" and jump straight to "${skipSuggestion.jumpTo.title}"?`)
    ]);
    const row = el("div", { class: "row" });
    const skipBtn = el("button", { class: "btn-primary" }, "Skip ahead");
    const declineBtn = el("button", { class: "btn-ghost" }, "No, stick with the plan");
    skipBtn.addEventListener("click", () => {
      skipSuggestion.skip.skipped = true;
      saveTopics();
      track("lesson_skipped", { topic: topic.title, lesson: skipSuggestion.skip.title });
      const jumpIdx = topic.lessons.indexOf(skipSuggestion.jumpTo);
      openLesson(topic.id, jumpIdx);
    });
    declineBtn.addEventListener("click", () => {
      topic.dismissedSkipFor = skipSuggestion.key;
      saveTopics();
      render();
    });
    row.appendChild(skipBtn);
    row.appendChild(declineBtn);
    card.appendChild(row);
    wrap.appendChild(card);
  }

  wrap.appendChild(list);

  const weak = weakConceptTitles(topic);
  if (weak.length > 0) {
    const reviewBtn = el("button", { class: "btn-ghost", style: "margin-top:16px;" },
      `🔄 Review what you've missed (${weak.length} concept${weak.length===1?"":"s"})`);
    reviewBtn.addEventListener("click", () => openReviewLesson(topic.id));
    wrap.appendChild(reviewBtn);
  }
  return wrap;
}

async function regenerateLesson(topicId, idx) {
  const topic = state.topics[topicId];
  const lesson = topic.lessons[idx];
  lesson.content = null;
  lesson.quiz = null;
  lesson.takeaway = null;
  lesson.imageUrl = null;
  lesson.furtherReading = null;
  lesson.done = false;
  state.loading = true;
  state.loadingMsg = "Regenerating this lesson...";
  state.error = null;
  render();
  try {
    await generateLessonContent(topic, lesson, idx);
  } catch (e) {
    state.error = friendlyError(e);
  }
  state.loading = false;
  render();
}

function LessonView() {
  const wrap = document.createDocumentFragment();
  const topic = state.topics[state.activeTopicId];
  if (!topic) { state.view = "home"; return wrap; }
  const idx = state.activeLessonIndex;
  const lesson = topic.lessons[idx];

  wrap.appendChild(el("span", { class: "backlink", onclick: () => { if (window.speechSynthesis) window.speechSynthesis.cancel(); state.view = "curriculum"; render(); } }, "← " + topic.title));

  const view = el("div", { class: "lesson-view" });
  const titleRow = el("div", { style: "display:flex;justify-content:space-between;align-items:flex-start;gap:10px;" });
  titleRow.appendChild(el("h2", { style: "margin:0;" }, lesson.title));
  if (lesson.content) {
    const regenBtn = el("button", { class: "btn-ghost", style: "font-size:11px;padding:5px 10px;flex-shrink:0;white-space:nowrap;" }, "↻ Regenerate");
    regenBtn.addEventListener("click", () => {
      if (confirm("Rewrite this lesson from scratch? Your quiz answers and progress on it will reset.")) {
        regenerateLesson(topic.id, idx);
      }
    });
    titleRow.appendChild(regenBtn);
  }
  view.appendChild(titleRow);

  if (lesson.content) {
    const upcoming = chooseNextLesson(topic, lesson.id);
    const nextKey = upcoming ? topic.id + ":" + upcoming.id : null;
    if (nextKey && prefetchStatus[nextKey]) {
      const s = prefetchStatus[nextKey];
      view.appendChild(el("div", {
        style: "font-family:-apple-system,sans-serif;font-size:12px;color:#8a8578;margin-bottom:12px;display:flex;align-items:center;gap:6px;"
      }, s === "loading"
        ? [el("div", { class: "spinner", style: "width:11px;height:11px;border-width:1.5px;" }), el("span", {}, "Preparing your next lesson in the background...")]
        : "✓ Next lesson is ready — it'll open instantly"
      ));
    }
    if (lesson.imageUrl) {
      const img = el("img", { class: "lesson-img", src: lesson.imageUrl, alt: lesson.title, loading: "lazy" });
      img.addEventListener("error", () => { img.style.display = "none"; });
      view.appendChild(img);
    }

    if (window.speechSynthesis) {
      const audioRow = el("div", { style: "display:flex;gap:8px;margin-bottom:14px;" });
      const listenBtn = el("button", { class: "btn-ghost" }, "🔊 Listen to this lesson");
      const stopBtn = el("button", { class: "btn-ghost", style: "display:none;" }, "⏹ Stop");
      listenBtn.addEventListener("click", () => toggleLessonAudio(lesson, listenBtn, stopBtn));
      stopBtn.addEventListener("click", () => {
        window.speechSynthesis.cancel();
        listenBtn.textContent = "🔊 Listen to this lesson";
        stopBtn.style.display = "none";
      });
      audioRow.appendChild(listenBtn);
      audioRow.appendChild(stopBtn);
      view.appendChild(audioRow);
    }

    const body = el("div", { class: "lesson-body" });
    body.innerHTML = lesson.content;
    view.appendChild(body);

    let quizResults = []; // track this viewing's answers to decide on adaptive bridge lesson
    if (lesson.quiz && lesson.quiz.length) {
      view.appendChild(el("h3", { style: "font-family:-apple-system,sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--moss);margin-top:22px;" }, "Quick check"));
      lesson.quiz.forEach((q, qi) => {
        const qBox = el("div", { style: "margin-bottom:14px;" });
        qBox.appendChild(el("p", { style: "font-weight:600;margin-bottom:6px;" }, q.question));
        const optWrap = el("div", { style: "display:flex;flex-direction:column;gap:6px;" });
        q.options.forEach((opt, oi) => {
          const optBtn = el("button", { class: "btn-ghost", style: "text-align:left;" }, opt);
          optBtn.addEventListener("click", () => {
            const correct = oi === q.correctIndex;
            optBtn.style.background = correct ? "#e3efe6" : "#fbeee8";
            optBtn.insertAdjacentHTML("beforeend", `<div style="font-family:-apple-system,sans-serif;font-size:12px;margin-top:4px;font-weight:400;">${correct ? "✓ Correct — " : "✗ "}${q.explanation}</div>`);
            recordQuizAnswer(topic.id, lesson.title, q.question, correct);
            track("quiz_answered", { topic: topic.title, correct });
            if (correct) awardXp(5, "quiz_correct");
            quizResults[qi] = correct;
          });
          optWrap.appendChild(optBtn);
        });
        qBox.appendChild(optWrap);
        view.appendChild(qBox);
      });
    }

    if (lesson.furtherReading && lesson.furtherReading.length > 0) {
      const readingBox = el("div", { class: "further-reading" });
      readingBox.appendChild(el("h3", { style: "font-family:-apple-system,sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#8a8578;margin:0 0 8px;" }, "Further reading"));
      lesson.furtherReading.forEach(r => {
        const link = el("a", { href: r.url, target: "_blank", rel: "noopener noreferrer", class: "reading-link" }, "↗ " + r.title);
        readingBox.appendChild(link);
      });
      view.appendChild(readingBox);
    }

    if (!lesson.done) {
      const doneBtn = el("button", { class: "btn-primary", style: "margin-top:16px;" }, "Mark lesson complete");
      doneBtn.addEventListener("click", () => {
        const answered = quizResults.filter(r => r !== undefined);
        const correctCount = answered.filter(Boolean).length;
        const scoreLow = answered.length > 0 && (correctCount / answered.length) < 0.5;
        const wasPerfect = answered.length > 0 && correctCount === answered.length;
        markLessonDone(topic.id, idx, wasPerfect);
        if (scoreLow && !lesson.isReview) {
          state.error = null;
          openReviewLesson(topic.id); // adaptive: low score triggers an immediate targeted bridge lesson
        }
      });
      view.appendChild(doneBtn);
    }

    // Chat panel
    const chatPanel = el("div", { class: "chat-panel" });
    chatPanel.appendChild(el("label", { class: "field-label" }, "Ask about this lesson"));
    const quick = el("div", { class: "quick-actions" });
    ["Explain differently", "Give another example", "Go deeper", "Quiz me more"].forEach(qa => {
      const b = el("button", { class: "btn-ghost" }, qa);
      b.addEventListener("click", () => sendChat(topic.id, idx, null, qa));
      quick.appendChild(b);
    });
    chatPanel.appendChild(quick);

    const key = topic.id + ":" + idx;
    const log = state.chatByLesson[key] || [];
    const logDiv = el("div", { class: "chat-log" });
    log.forEach(m => {
      const bubble = el("div", { class: "msg " + m.role });
      const paras = String(m.text).split(/\n\s*\n/).filter(p => p.trim());
      if (paras.length <= 1) {
        bubble.textContent = m.text;
      } else {
        paras.forEach(p => bubble.appendChild(el("p", { style: "margin:0 0 8px;" }, p.trim())));
        bubble.lastChild.style.marginBottom = "0";
      }
      logDiv.appendChild(bubble);
    });
    chatPanel.appendChild(logDiv);

    const inputRow = el("div", { class: "row" });
    const chatInput = el("input", { type: "text", placeholder: "Ask a question..." });
    const sendBtn = el("button", { class: "btn-primary" }, "Send");
    const doSend = () => { const v = chatInput.value; chatInput.value = ""; sendChat(topic.id, idx, v); };
    sendBtn.addEventListener("click", doSend);
    chatInput.addEventListener("keydown", e => { if (e.key === "Enter") doSend(); });
    inputRow.appendChild(chatInput);
    inputRow.appendChild(sendBtn);
    chatPanel.appendChild(inputRow);

    view.appendChild(chatPanel);
  }

  wrap.appendChild(view);
  return wrap;
}

function applyTheme() {
  const saved = localStorage.getItem("learn-anything-theme");
  const dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.body.classList.toggle("dark", dark);
}
function toggleTheme() {
  const isDark = document.body.classList.contains("dark");
  document.body.classList.toggle("dark", !isDark);
  localStorage.setItem("learn-anything-theme", !isDark ? "dark" : "light");
  render();
}
window.addEventListener("online", () => {
  if (state.session) pushToServer(); // reconnected — flush anything that was saved locally while offline
});
window.addEventListener("offline", () => {
  if (state.session) { state.syncStatus = "offline"; render(); }
});

applyTheme();
loadTopics();
</script>
</body>
</html>

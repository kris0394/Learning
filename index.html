<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Learn Anything</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #223142;        /* deep ledger-ink navy */
    --paper: #edefe2;      /* aged sage-paper */
    --moss: #2c4a5e;       /* steel ink-blue — primary accent */
    --moss-dark: #1a303f;
    --clay: #b8842c;       /* ochre stamp gold — secondary accent */
    --line: #cbcdb4;       /* hairline rule */
    --card: #f9f8ee;       /* index-card stock */
    --display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
    --body-serif: 'Source Serif 4', 'Iowan Old Style', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  body.dark {
    --ink: #dde1d2;
    --paper: #12181d;
    --moss: #7fa8c4;
    --moss-dark: #a5c8de;
    --clay: #dcae57;
    --line: #2b333a;
    --card: #1b2229;
  }
  body.dark .chip { background: var(--card); color: var(--ink); }
  body.dark input[type=text] { background: var(--card); color: var(--ink); border-color: var(--line); }
  body { transition: background-color 0.2s, color 0.2s; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(34,49,66,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: var(--body-serif);
    -webkit-font-smoothing: antialiased;
  }
  body.dark { background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.04) 1px, transparent 0); }
  .app { max-width: 820px; margin: 0 auto; padding: 28px 20px 80px; }
  header.top {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 6px;
  }
  header.top h1 {
    font-family: var(--display); font-size: 27px; margin: 0; letter-spacing: 0.2px;
    font-weight: 600; font-optical-sizing: auto;
  }
  header.top .tag {
    font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--moss); border: 1px solid var(--moss);
    padding: 4px 8px; border-radius: 2px;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--moss); opacity: 0.75; margin: 0 0 26px;
  }
  .streak-stamp {
    font-family: var(--mono); font-weight: 600; font-size: 11px; letter-spacing: 0.5px;
    color: var(--clay); border: 1.5px solid var(--clay); border-radius: 50%;
    width: 40px; height: 40px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; transform: rotate(-6deg); line-height: 1.1; flex-shrink: 0;
  }
  .streak-stamp .n { font-size: 15px; }
  .budget {
    font-family: -apple-system, sans-serif; font-size: 12px; color: #7a7568;
    margin-bottom: 24px; display: flex; gap: 6px; align-items: center;
  }
  .budget .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--moss); }
  .budget.warn .dot { background: var(--clay); }

  button {
    font-family: var(--mono); cursor: pointer; border: none;
    border-radius: 2px; font-size: 13px; padding: 10px 16px; font-weight: 600;
    letter-spacing: 0.2px;
  }
  .btn-primary { background: var(--moss); color: var(--card); }
  .btn-primary:hover { background: var(--moss-dark); }
  .btn-primary:disabled { background: #9aa5ab; cursor: default; }
  .btn-ghost { background: transparent; color: var(--moss); border: 1px solid var(--moss); }
  .btn-ghost:hover { background: rgba(44,74,94,0.08); }
  input[type=text] {
    font-family: var(--body-serif); font-size: 17px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 2px; width: 100%; background: var(--card);
  }
  input[type=text]:focus { outline: 2px solid var(--moss); outline-offset: 1px; }

  /* HOME */
  .home-grid { display: grid; gap: 12px; margin-bottom: 34px; }
  .topic-card {
    background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--moss);
    border-radius: 2px; box-shadow: 2px 3px 0 rgba(34,49,66,0.06);
    padding: 16px 18px; display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: transform .12s, box-shadow .12s;
  }
  .topic-card:hover { transform: translate(-1px,-1px); box-shadow: 3px 4px 0 rgba(34,49,66,0.1); }
  .topic-card h3 { margin: 0 0 4px; font-size: 18px; font-family: var(--display); font-weight: 600; }
  .topic-card .meta { font-family: var(--mono); font-size: 11px; color: var(--moss); opacity: 0.75; letter-spacing: 0.3px; }
  .progress-ring { display: flex; align-items: center; gap: 10px; }
  .bar-track { width: 90px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--clay); }
  .pct { font-family: var(--mono); font-size: 12px; color: var(--clay); font-weight: 600; }

  .new-topic-box {
    background: var(--card); border: 1px solid var(--line); border-radius: 2px; padding: 22px;
    box-shadow: 2px 3px 0 rgba(34,49,66,0.06);
  }
  .new-topic-box h2 { margin-top: 0; font-size: 20px; font-family: var(--display); font-weight: 600; }
  .autocomplete-box {
    position: absolute; top: calc(100% + 2px); left: 0; right: 0; z-index: 20;
    background: var(--card); border: 1px solid var(--line); border-radius: 2px;
    box-shadow: 2px 3px 0 rgba(34,49,66,0.1); max-height: 220px; overflow-y: auto;
  }
  .autocomplete-item {
    padding: 10px 14px; font-family: var(--body-serif); font-size: 15px; cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:hover { background: var(--paper); }
  .further-reading {
    margin-top: 24px; padding-top: 16px; border-top: 1px dashed var(--line);
    display: flex; flex-direction: column; gap: 6px;
  }
  .reading-link {
    font-family: var(--mono); font-size: 12.5px; color: var(--moss); text-decoration: none;
    opacity: 0.85; width: fit-content;
  }
  .reading-link:hover { text-decoration: underline; opacity: 1; }
  .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .chip-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .chip {
    font-family: var(--mono); font-size: 12px; padding: 7px 13px;
    border: 1px solid var(--line); border-radius: 20px; cursor: pointer; background: var(--card);
  }
  .chip.selected { background: var(--moss); color: var(--card); border-color: var(--moss); }
  label.field-label {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--moss); opacity: 0.8; display: block; margin: 16px 0 4px;
  }

  /* CURRICULUM / LESSON view */
  .backlink {
    font-family: var(--mono); font-size: 12px; color: var(--moss);
    cursor: pointer; margin-bottom: 16px; display: inline-block;
  }
  .curric-title { font-size: 24px; margin: 0 0 4px; }
  .lesson-list { display: grid; gap: 8px; margin-top: 18px; }
  .lesson-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 5px; background: var(--card); cursor: pointer;
  }
  .lesson-row.locked { opacity: 0.5; cursor: default; }
  .lesson-row.done { border-color: var(--moss); }
  .lesson-num {
    font-family: -apple-system, sans-serif; font-size: 12px; width: 22px; height: 22px;
    border-radius: 50%; border: 1px solid var(--moss); color: var(--moss);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .lesson-row.done .lesson-num { background: var(--moss); color: white; }

  .lesson-view h2 { font-size: 24px; margin-bottom: 4px; }
  .lesson-body { line-height: 1.65; font-size: 16.5px; }
  .lesson-body h3 { font-size: 15px; text-transform: uppercase; letter-spacing: 1px; color: var(--moss); font-family: -apple-system, sans-serif; margin: 22px 0 6px; }
  .lesson-body p { margin: 0 0 12px; }
  .lesson-body ul, .lesson-body ol { margin: 0 0 12px 20px; }

  .chat-panel { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 18px; }
  .chat-log { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .msg { padding: 10px 14px; border-radius: 6px; font-size: 15px; line-height: 1.5; max-width: 90%; }
  .msg.user { background: #eef2ee; align-self: flex-end; }
  .msg.ai { background: var(--card); border: 1px solid var(--line); align-self: flex-start; }
  .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

  .loading { font-family: -apple-system, sans-serif; color: #8a8578; font-size: 14px; padding: 20px 0; }
  .loading-skel {
    display: flex; align-items: center; gap: 10px; font-family: -apple-system, sans-serif;
    color: #8a8578; font-size: 14px; padding: 20px 0;
  }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--moss);
    border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .app > *:not(header) { animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .error-box {
    background: #fbeee8; border: 1px solid var(--clay); color: #7a3a20; padding: 12px 14px;
    border-radius: 5px; font-family: -apple-system, sans-serif; font-size: 13.5px; margin: 14px 0;
  }
  .lesson-img {
    width: 100%; max-height: 260px; object-fit: cover; border-radius: 6px; margin-bottom: 16px;
    border: 1px solid var(--line);
  }
  img, svg { max-width: 100%; }

  @media (max-width: 600px) {
    .app { padding: 16px 14px 60px; }
    header.top { flex-direction: column; align-items: flex-start; gap: 8px; }
    header.top h1 { font-size: 21px; }
    .topic-card { flex-direction: column; align-items: flex-start; gap: 10px; }
    .progress-ring { width: 100%; }
    .bar-track { flex: 1; }
    .row { flex-direction: column; }
    .row button, .row input { width: 100%; }
    .chip { font-size: 12.5px; padding: 6px 11px; }
    .lesson-body { font-size: 16px; }
    .msg { max-width: 100%; }
    .quick-actions button { flex: 1 1 45%; font-size: 12.5px; padding: 8px 10px; }
  }
</style>
</head>
<body>
<div id="root" class="app"></div>

<script>
window.addEventListener("error", (e) => {
  const root = document.getElementById("root");
  if (root && !root.hasChildNodes()) {
    root.innerHTML = '<div style="font-family:-apple-system,sans-serif;padding:20px;color:#7a3a20;">' +
      '<h2 style="margin-top:0;">Something failed to load</h2>' +
      '<p style="font-size:14px;">' + (e.message || "Unknown error") + '</p>' +
      '<p style="font-size:13px;color:#8a8578;">Try opening this directly in the Claude app/chat rather than as a downloaded file — some mobile browsers block local scripts.</p>' +
      '</div>';
  }
});

// 👇 Paste your Cloudflare Worker URL here after you set it up (see cloudflare-worker.js instructions)
const WORKER_URL = "https://learn-anything-proxy.sadagopankrishnan.workers.dev";

// --- Lightweight, anonymous usage analytics (helps you see how testers use the app) ---
function getDeviceId() {
  let id = localStorage.getItem("learn-anything-device-id");
  if (!id) {
    id = "d_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem("learn-anything-device-id", id);
  }
  return id;
}
function track(type, extra = {}) {
  try {
    fetch(WORKER_URL + "/event", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, deviceId: getDeviceId(), clientTime: Date.now(), ...extra })
    }).catch(() => {}); // never let analytics affect the app
  } catch (e) { /* ignore */ }
}
const API_URL = WORKER_URL;
// Static safety net, used only if the live model list can't be fetched at all.
const FALLBACK_MODEL_CANDIDATES = [
  "openrouter/free",
  "meta-llama/llama-3.3-70b-instruct:free",
  "deepseek/deepseek-chat-v3.1:free"
];
let liveFreeModels = null; // populated on first use, cached for the session

// Rough speed heuristic: smaller models (by params hinted in the id) respond faster.
// We don't have real latency data client-side, so this is a best-effort ordering,
// not a guarantee — quality still comes from whichever model actually answers.
function bySpeedHint(ids) {
  const sizeOf = (id) => {
    const m = id.match(/(\d+)(b|B)(?!.*\d)/); // e.g. "8b", "70b" — last size-like token
    return m ? parseInt(m[1], 10) : 999; // unknown size sorts last (assume it's a big/slow one)
  };
  return [...ids].sort((a, b) => sizeOf(a) - sizeOf(b));
}

async function getFreeModelList() {
  if (liveFreeModels) return liveFreeModels;
  try {
    const res = await fetch("https://openrouter.ai/api/v1/models");
    const data = await res.json();
    const free = (data.data || [])
      .filter(m => m.id && m.id.endsWith(":free") &&
        parseFloat(m.pricing?.prompt || "1") === 0 &&
        parseFloat(m.pricing?.completion || "1") === 0)
      .map(m => m.id);
    const fastFirst = bySpeedHint(free).slice(0, 6);
    // Auto-router first (self-selects a live free model), then fastest-looking real ones as backup
    liveFreeModels = [...fastFirst, "openrouter/free"];
    if (liveFreeModels.length <= 1) liveFreeModels = FALLBACK_MODEL_CANDIDATES;
  } catch (e) {
    liveFreeModels = FALLBACK_MODEL_CANDIDATES;
  }
  return liveFreeModels;
}


// The Worker enforces a real per-account daily cap (DAILY_AI_CAP in cloudflare-worker.js,
// currently 60/day) — this local number is only a fallback estimate for before the first
// AI call of the session, when we haven't heard the real count back from the server yet.
const ASSUMED_BUDGET = 60;

const DAILY_FREE_LIMIT = 50; // OpenRouter's published free-tier daily cap (approximate, may vary)
const COUNTRIES = ["Global / none", "United States", "United Kingdom", "India", "Nigeria", "Philippines", "Canada", "Australia", "South Africa", "Kenya", "Pakistan", "Brazil", "Mexico", "Germany", "France", "Indonesia", "Other"];

let state = {
  view: "home",       // home | new | curriculum | lesson
  topics: {},          // id -> {id,title,level,style,country,lessons:[{title,content,quiz,done,imageUrl}], activeIndex, createdAt}
  activeTopicId: null,
  activeLessonIndex: null,
  newTopicDraft: { title: "", level: "Beginner", style: "examples", country: "Global / none", step: 1 },
  chatByLesson: {},    // "topicId:lessonIdx" -> [{role,text}]
  loading: false,
  loadingMsg: "",
  error: null,
  msgCount: 0,
  realRemaining: null, // filled in from the Worker's X-AI-Usage-Remaining header once we've made a call this session
  quotaUsedToday: 0,
  quotaDate: null,
  streakCount: 0,
  lastActiveDate: null,
  lastActiveAt: 0,
  session: null,       // { email, token } once signed in
  authMode: "login",   // "login" | "signup" | "forgot"
  syncStatus: "idle"   // idle | syncing | synced | offline | error
};

function render() { App(); }

// ============================== DEPENDENCY GRAPH HELPERS ==============================
// Lessons carry an id + prerequisites (array of lesson ids) instead of relying purely on
// array order. This lets the curriculum branch/merge slightly instead of being a strict
// straight line, while staying fully backward compatible with topics saved before this
// existed (those just get treated as a simple chain, id-per-index).

// Backfills id/prerequisites on any topic saved before the dependency graph existed,
// so every topic can be treated uniformly from here on. Safe to call repeatedly.
function ensureGraphFields(topic) {
  if (!topic || !topic.lessons) return;
  topic.lessons.forEach((l, i) => { if (!l.id) l.id = "l" + i; });
  topic.lessons.forEach((l, i) => {
    if (!Array.isArray(l.prerequisites)) l.prerequisites = i === 0 ? [] : [topic.lessons[i - 1].id];
  });
}
function ensureGraphFieldsAll() { Object.values(state.topics).forEach(ensureGraphFields); }

// Defends against AI-generated graphs that reference missing ids, self-reference, or
// form a cycle — any of which would otherwise soft-lock the whole curriculum with no
// lesson ever becoming available. Falls back those specific lessons to a simple chain.
function sanitizeGraph(lessons) {
  const ids = new Set(lessons.map(l => l.id));
  lessons.forEach(l => { l.prerequisites = (l.prerequisites || []).filter(pid => ids.has(pid) && pid !== l.id); });
  if (!lessons.some(l => l.prerequisites.length === 0) && lessons.length) lessons[0].prerequisites = [];

  // BFS reachability from every zero-prerequisite lesson; anything unreachable
  // (dangling/cyclical references) gets chained to the previous lesson instead.
  const reachable = new Set(lessons.filter(l => l.prerequisites.length === 0).map(l => l.id));
  let changed = true;
  while (changed) {
    changed = false;
    lessons.forEach(l => {
      if (!reachable.has(l.id) && l.prerequisites.every(pid => reachable.has(pid))) { reachable.add(l.id); changed = true; }
    });
  }
  lessons.forEach((l, i) => { if (!reachable.has(l.id)) l.prerequisites = i > 0 ? [lessons[i - 1].id] : []; });
}

function isLessonUnlocked(topic, lesson) {
  if (lesson.isReview || lesson.isDailyReview) return true; // side-quest lessons are always open, not part of the main path
  return (lesson.prerequisites || []).every(pid => {
    const p = topic.lessons.find(l => l.id === pid);
    return p && (p.done || p.skipped); // a skipped lesson still counts as "resolved" for unlocking purposes
  });
}

// Picks the next recommended lesson: first not-done, not-skipped, unlocked lesson in
// curriculum order. `assumeDoneId`, if given, treats that one lesson as resolved for this
// calculation — used by prefetch to ask "what comes right after the one they're currently
// reading" even before they've actually finished/quizzed on it yet. Review/daily-review
// side-quest lessons are never suggested as "the next lesson" — only reached via their own buttons.
function chooseNextLesson(topic, assumeDoneId) {
  const resolvedIds = new Set(topic.lessons.filter(l => l.done || l.skipped || l.id === assumeDoneId).map(l => l.id));
  return topic.lessons.find(l =>
    !l.done && !l.skipped && l.id !== assumeDoneId && !l.isReview && !l.isDailyReview &&
    (l.prerequisites || []).every(pid => resolvedIds.has(pid))
  ) || null;
}

// Notices when a learner is consistently doing well and proactively offers to skip the
// currently-recommended lesson in favor of jumping straight to whatever comes after it —
// rather than only passively allowing an "Open anyway" override on locked lessons.
// Deliberately conservative: requires real signal (several correct answers, zero open
// weak spots) and at least one lesson already completed, so it never fires on lesson one.
function findSkipAheadSuggestion(topic) {
  const profile = topic.profile;
  if (!profile || (profile.strong || []).length < 3) return null;
  if ((profile.weak || []).length > 0) return null; // open weak spots mean reinforcement is more useful than skipping
  if (topic.lessons.filter(l => l.done).length < 2) return null;

  const next = chooseNextLesson(topic, null);
  if (!next) return null;
  const afterNext = chooseNextLesson(topic, next.id); // what would unlock if `next` were resolved
  if (!afterNext) return null; // nothing further to jump ahead to

  const suggestionKey = next.id + ":" + afterNext.id;
  if (topic.dismissedSkipFor === suggestionKey) return null; // already turned down this exact suggestion
  return { skip: next, jumpTo: afterNext, key: suggestionKey };
}

async function loadTopics() {
  try {
    // --- Handle OAuth Redirect Hash Fragment ---
    const hash = window.location.hash;
    if (hash.includes('token=')) {
      const params = new URLSearchParams(hash.substring(1));
      const token = params.get('token');
      const email = params.get('email');
      const verified = params.get('verified');
      if (token) {
        state.session = { email: email ? decodeURIComponent(email) : "Google User", token: token, emailVerified: verified === "1" };
        localStorage.setItem("learn-anything-session", JSON.stringify(state.session));
        history.replaceState(null, null, window.location.pathname);
      }
    }

    const raw = localStorage.getItem("learn-anything-topics");
    if (raw) state.topics = JSON.parse(raw); // local cache loads instantly, before any network call
    ensureGraphFieldsAll(); // backfill id/prerequisites on any topic saved before the dependency graph existed
    loadGamification(); // must run before anything (markLessonDone, achievements, etc.) touches state.gamification
    const streakRaw = localStorage.getItem("learn-anything-streak");
    if (streakRaw) {
      const s = JSON.parse(streakRaw);
      state.streakCount = s.count || 0;
      state.lastActiveDate = s.lastDate || null;
      state.lastActiveAt = s.lastAt || 0;
    }
    const sessionRaw = localStorage.getItem("learn-anything-session");
    if (sessionRaw && !state.session) state.session = JSON.parse(sessionRaw);

    // First-ever visit (no prior topics, no saved session, not arriving via an OAuth
    // redirect) — show the intro before anything else so new people see what this
    // actually is before diving into the wizard.
    if (!raw && !sessionRaw && !hash.includes('token=') && !localStorage.getItem("learn-anything-seen-intro")) {
      state.view = "intro";
    }
  } catch (e) { /* no data yet, or storage unavailable (e.g. private browsing) */ }
  updateStreak();
  render();

  if (state.session) await pullFromServer(); // merge in anything saved from another device
}
// ============================== GAMIFICATION ==============================
// Synced to the server alongside topics (same debounced push/merge-on-pull pattern),
// so XP, streaks, and unlocked achievements follow you to a new device — not just
// local-only. XP and achievements are meant to reflect real actions (lessons
// finished, correct answers, streaks kept), not just clicks.

const XP_LEVELS = [0, 100, 250, 500, 900, 1400, 2000, 2800, 3800, 5000]; // xp needed for level 1,2,3...

const ACHIEVEMENTS = [
  { id: "first_lesson", icon: "🌱", title: "First Steps", desc: "Complete your first lesson", check: (g, topics) => totalLessonsDone(topics) >= 1 },
  { id: "curious", icon: "🔭", title: "Curious Mind", desc: "Start 3 different topics", check: (g, topics) => Object.keys(topics).length >= 3 },
  { id: "streak_3", icon: "🔥", title: "On a Roll", desc: "Keep a 3-day streak", check: () => state.streakCount >= 3 },
  { id: "streak_7", icon: "🔥", title: "Dedicated", desc: "Keep a 7-day streak", check: () => state.streakCount >= 7 },
  { id: "ten_lessons", icon: "📚", title: "Deep Diver", desc: "Complete 10 lessons total", check: (g, topics) => totalLessonsDone(topics) >= 10 },
  { id: "well_rounded", icon: "🧭", title: "Well Rounded", desc: "Complete a lesson in 3 different topics", check: (g, topics) => Object.values(topics).filter(t => t.lessons.some(l => l.done)).length >= 3 },
  { id: "perfectionist", icon: "🎯", title: "Perfectionist", desc: "Get every quiz question right on 5 lessons", check: (g) => (g.perfectLessons || 0) >= 5 },
  { id: "comeback", icon: "🔄", title: "Comeback", desc: "Complete a review lesson", check: (g) => (g.reviewsCompleted || 0) >= 1 },
  { id: "level_5", icon: "⭐", title: "Well Established", desc: "Reach level 5", check: (g) => xpLevel(g.xp || 0) >= 5 },
];

function xpLevel(xp) {
  let lvl = 1;
  for (let i = 1; i < XP_LEVELS.length; i++) { if (xp >= XP_LEVELS[i]) lvl = i + 1; }
  return lvl;
}
function xpForNextLevel(xp) {
  const lvl = xpLevel(xp);
  return lvl - 1 < XP_LEVELS.length ? XP_LEVELS[lvl - 1] ?? null : null; // null once past the defined curve — still counts, just no more level-ups tracked
}
function totalLessonsDone(topics) {
  return Object.values(topics).reduce((sum, t) => sum + t.lessons.filter(l => l.done).length, 0);
}

function loadGamification() {
  try {
    const raw = localStorage.getItem("learn-anything-gamification");
    if (raw) state.gamification = JSON.parse(raw);
  } catch (e) { /* fresh start */ }
  if (!state.gamification) state.gamification = { xp: 0, unlocked: {}, completionLog: [], perfectLessons: 0, reviewsCompleted: 0, weeklyGoal: 5 };
}
function saveGamification() {
  try { localStorage.setItem("learn-anything-gamification", JSON.stringify(state.gamification)); } catch (e) { /* ignore */ }
  if (state.session) { // debounced, same pattern as saveTopics — cheap to call often
    clearTimeout(syncDebounceTimer);
    syncDebounceTimer = setTimeout(() => pushToServer(), 1200);
  }
}

// Awards XP and checks for newly-unlocked achievements in one place, so every XP-earning
// action stays consistent. Newly unlocked achievements queue up as a dismissible toast.
function awardXp(amount, reason) {
  const g = state.gamification;
  g.xp = (g.xp || 0) + amount;
  checkAchievements();
  saveGamification();
  track("xp_awarded", { amount, reason });
}
function checkAchievements() {
  const g = state.gamification;
  ACHIEVEMENTS.forEach(a => {
    if (g.unlocked[a.id]) return;
    if (a.check(g, state.topics)) {
      g.unlocked[a.id] = Date.now();
      state.achievementToast = a; // shown once, dismissed manually or replaced by the next unlock
    }
  });
}
function lessonsThisWeek() {
  const now = new Date();
  const day = now.getDay() || 7; // Monday-start week
  const monday = new Date(now); monday.setHours(0,0,0,0); monday.setDate(now.getDate() - day + 1);
  return (state.gamification.completionLog || []).filter(ts => ts >= monday.getTime()).length;
}
function setWeeklyGoal(n) {
  state.gamification.weeklyGoal = Math.max(1, Math.min(50, n));
  saveGamification();
  render();
}

function updateStreak() {
  const today = new Date().toDateString();
  if (state.lastActiveDate === today) return; // already counted today
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  const wasContinuing = state.lastActiveDate === yesterday;
  if (wasContinuing) {
    state.streakCount += 1; // kept the streak going
  } else {
    state.streakCount = 1; // streak broken or first ever visit
  }
  state.lastActiveDate = today;
  state.lastActiveAt = Date.now(); // epoch timestamp, used to resolve which device's streak is more current on sync
  try {
    localStorage.setItem("learn-anything-streak", JSON.stringify({ count: state.streakCount, lastDate: today, lastAt: state.lastActiveAt }));
  } catch (e) { /* ignore */ }
  if (wasContinuing && state.streakCount > 1) awardXp(5, "streak_continued"); // small, frequent nudge — not on day 1
  track("daily_open", { streak: state.streakCount });
}

let syncDebounceTimer = null;

async function saveTopics() {
  // Local save is synchronous-feeling and always happens first — the app never
  // waits on the network to feel responsive, and your data is never only server-side.
  try {
    localStorage.setItem("learn-anything-topics", JSON.stringify(state.topics));
  } catch (e) { console.error("local save failed", e); }

  if (!state.session) return; // no account set up — local-only is still fully functional
  clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(() => pushToServer(), 1200); // debounced so rapid edits don't spam the network
}

// Retries a fetch a couple of times with a short backoff before giving up —
// covers flaky mobile connections and momentary Worker/network blips.
async function fetchWithRetry(url, options, attempts = 3) {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      const res = await fetch(url, options);
      if (res.ok || res.status < 500) return res; // don't retry real 4xx errors, only network/5xx flakiness
      lastErr = new Error("Server error " + res.status);
    } catch (e) {
      lastErr = e;
    }
    if (i < attempts - 1) await new Promise(r => setTimeout(r, 500 * (i + 1)));
  }
  throw lastErr;
}

// Builds the full payload sent to the server — topics plus gamification/streak,
// versioned so pullFromServer can tell this apart from the older flat-topics-only
// format that earlier app versions saved (avoids breaking anyone mid-upgrade).
function buildSyncPayload() {
  return {
    __v: 2,
    topics: state.topics,
    gamification: state.gamification,
    streak: { count: state.streakCount, lastActiveDate: state.lastActiveDate, lastActiveAt: state.lastActiveAt }
  };
}

async function pushToServer() {
  if (!state.session || !navigator.onLine) { state.syncStatus = "offline"; render(); return; }
  state.syncStatus = "syncing"; render();
  try {
    const res = await fetchWithRetry(WORKER_URL + "/data", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.session.token },
      body: JSON.stringify({ topics: buildSyncPayload() })
    });
    const data = await res.json();
    if (res.status === 401) { logout(); state.error = "Signed out — please log in again to keep syncing."; }
    state.syncStatus = data.ok ? "synced" : "error";
  } catch (e) {
    state.syncStatus = "error";
  }
  render();
}

// Combines two gamification objects from different devices without ever losing progress:
// XP and lifetime counters take the higher value (both should only ever grow), achievement
// unlocks are unioned (keeping the earliest unlock time if both sides have it), and the
// weekly goal target/log are unioned by timestamp so a goal set on one device isn't lost.
function mergeGamification(local, server) {
  if (!server) return local;
  if (!local) return server;
  const unlocked = { ...server.unlocked };
  for (const [id, ts] of Object.entries(local.unlocked || {})) {
    unlocked[id] = unlocked[id] ? Math.min(unlocked[id], ts) : ts;
  }
  const logSet = new Map();
  [...(server.completionLog || []), ...(local.completionLog || [])].forEach(ts => logSet.set(ts, ts));
  return {
    xp: Math.max(local.xp || 0, server.xp || 0),
    unlocked,
    completionLog: [...logSet.values()].sort((a, b) => a - b).slice(-500),
    perfectLessons: Math.max(local.perfectLessons || 0, server.perfectLessons || 0),
    reviewsCompleted: Math.max(local.reviewsCompleted || 0, server.reviewsCompleted || 0),
    weeklyGoal: local.weeklyGoal || server.weeklyGoal || 5 // most-recently-set-locally wins; goal target itself isn't time-stamped, this is a reasonable default
  };
}

async function pullFromServer() {
  if (!navigator.onLine) { state.syncStatus = "offline"; render(); return; }
  try {
    const res = await fetchWithRetry(WORKER_URL + "/data", {
      method: "GET",
      headers: { "Authorization": "Bearer " + state.session.token }
    });
    if (res.status === 401) { logout(); return; }
    const data = await res.json();
    if (data.ok && data.topics) {
      const isWrapped = data.topics && data.topics.__v === 2;
      const serverTopics = isWrapped ? data.topics.topics : data.topics; // backward compatible with pre-gamification saves
      const serverGamification = isWrapped ? data.topics.gamification : null;
      const serverStreak = isWrapped ? data.topics.streak : null;

      // Merge rather than blindly overwrite: keep whichever copy of each topic is newer,
      // so switching devices never silently loses progress made on the one you're on now.
      const merged = { ...serverTopics };
      for (const [id, localTopic] of Object.entries(state.topics)) {
        const serverTopic = serverTopics ? serverTopics[id] : null;
        if (!serverTopic || (localTopic.lastOpenedAt || 0) > (serverTopic.lastOpenedAt || 0)) {
          merged[id] = localTopic;
        }
      }
      state.topics = merged;
      ensureGraphFieldsAll(); // backfill for any topic (local or server) saved before the dependency graph existed
      localStorage.setItem("learn-anything-topics", JSON.stringify(state.topics));

      state.gamification = mergeGamification(state.gamification, serverGamification);
      localStorage.setItem("learn-anything-gamification", JSON.stringify(state.gamification));

      // Streak: trust whichever device was active more recently — it's the more
      // authoritative account of whether the streak is still alive today.
      if (serverStreak && (serverStreak.lastActiveAt || 0) > (state.lastActiveAt || 0)) {
        state.streakCount = serverStreak.count || 0;
        state.lastActiveDate = serverStreak.lastActiveDate || null;
        state.lastActiveAt = serverStreak.lastActiveAt || 0;
        localStorage.setItem("learn-anything-streak", JSON.stringify({ count: state.streakCount, lastDate: state.lastActiveDate, lastAt: state.lastActiveAt }));
      }

      checkAchievements(); // in case merged progress alone crosses a new threshold
      state.syncStatus = "synced";
      render();
    }
  } catch (e) {
    state.syncStatus = "error"; render();
  }
}

// Already-cached lessons/topics remain fully browsable without signing in.
function requireLogin() {

  state.view = "account";
  state.error = "Sign in to generate new lessons — protects the shared AI quota from abuse. Browsing what's already loaded doesn't need an account.";
  render();

}

// Manual backup, independent of accounts/server — always available as a safety net.
function exportBackup() {
  const blob = new Blob([JSON.stringify({ topics: state.topics, exportedAt: new Date().toISOString() }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "learn-anything-backup-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.topics) throw new Error("Not a valid backup file");
      state.topics = { ...state.topics, ...parsed.topics }; // merge, don't wipe current progress
      ensureGraphFieldsAll(); // backfill for backups exported before the dependency graph existed
      saveTopics();
      render();
    } catch (err) {
      state.error = "Couldn't read that backup file — make sure it's an unmodified export from this app.";
      render();
    }
  };
  reader.readAsText(file);
}

function bumpMsgCount() { state.msgCount++; }

function cleanText(s) {
  if (!s) return s;
  return s
    .replace(/\*\*(.*?)\*\*/g, "$1")   // **bold**
    .replace(/\*(.*?)\*/g, "$1")       // *italic*
    .replace(/^\*+|\*+$/g, "")         // stray leading/trailing asterisks
    .trim();
}

async function callAI(messages, { json = false, maxTokens = 900 } = {}) {
  if (!requireLogin()) throw new Error("Sign in required");
  bumpMsgCount();
  let lastErr = null;
  const candidates = await getFreeModelList();
  for (const model of candidates) {
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.session.token },
        body: JSON.stringify({ model, messages, temperature: 0.7, max_tokens: maxTokens })
      });
      // The Worker tracks the real daily count server-side (per account, across all
      // devices/sessions) — read it whenever present so the on-screen number reflects
      // reality instead of a guess that resets every time the page reloads.
      const realRemaining = res.headers.get("X-AI-Usage-Remaining");
      if (realRemaining !== null) state.realRemaining = parseInt(realRemaining, 10);
      if (res.status === 401) { logout(); throw new Error("Session expired — please sign in again"); }
      if (res.status === 403) {
        const errData = await res.json().catch(() => ({}));
        if (errData.code === "EMAIL_NOT_VERIFIED") {
          if (state.session) state.session.emailVerified = false; // reflect it locally so the banner shows without waiting on next login
          throw new Error("EMAIL_NOT_VERIFIED: " + (errData.error || "Please verify your email first"));
        }
        throw new Error(errData.error || "Not allowed");
      }
      if (res.status === 429) {
        const errData = await res.json().catch(() => ({}));
        if (errData.code === "DAILY_CAP_REACHED") {
          throw new Error("Daily AI usage limit reached — resets tomorrow");
        }
        // Not the account's daily cap — just this particular free model being briefly
        // overloaded (common, since it's free). Try the next candidate model instead
        // of telling the user they're out of quota when they're not.
        throw new Error("This free model is temporarily busy — trying another...");
      }
      if (!res.ok) {
        const t = await res.text().catch(()=> "");
        throw new Error("API error " + res.status + ": " + t.slice(0,200));
      }
      const data = await res.json();
      const content = data?.choices?.[0]?.message?.content;
      if (!content) throw new Error("Empty response from model");
      if (json) {
        let cleaned = content.trim().replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
        return JSON.parse(cleaned);
      }
      return content;
    } catch (e) {
      lastErr = e;
      if (e.message.includes("usage limit") || e.message.includes("Sign in required") || e.message.includes("EMAIL_NOT_VERIFIED")) break; // no point trying other models
      // otherwise try next candidate model
    }
  }
  throw lastErr || new Error("All model candidates failed");
}

async function generateCurriculum() {
  const draft = state.newTopicDraft;
  if (!draft.title.trim()) return;
  state.loading = true;
  state.loadingMsg = "Building your curriculum...";
  state.error = null;
  render();

  const sys = `You are a curriculum designer. Given a topic, learner level, and learning style, output ONLY valid JSON (no markdown fences, no commentary) with this exact shape:
{"description": "one short unambiguous sentence clarifying exactly what this topic refers to (important if the topic name alone could be confused with something else entirely — e.g. a company/product name that's also a sports team, animal, place, or common word)", "lessons": [{"id": "l1", "title": "string", "prerequisites": []}, {"id": "l2", "title": "string", "prerequisites": ["l1"]}]}
Produce 6 to 9 lessons that form a logical learning sequence from foundational to more advanced, appropriate for the stated level. Use short sequential ids like "l1","l2",... "prerequisites" lists the ids of lessons that should be understood before this one — most lessons should just depend on the single lesson before them (a simple chain), but where it makes real sense (e.g. two independent foundational lessons both feed into one later lesson, or a lesson has no real prerequisite and could be taken early), reflect that with 0, 1, or 2 prerequisite ids. Keep it mostly linear — at most 2-3 branch points total, since this should still feel like a simple guided path, not a complex diagram. Keep titles short and concrete. If the topic spans multiple traditions, schools of thought, or cultures (this is common for religion, philosophy, history, or comparative subjects), make sure at least one or two lessons explicitly compare perspectives across them rather than only teaching a single tradition's account as if it were the whole subject.`;
  const countryLine = draft.country ? `\nLearner's country: ${draft.country} (prefer this context where relevant for later lesson examples, not necessarily in titles)` : "";
  const user = `Topic: ${draft.title}\nLearner level: ${draft.level}\nPreferred learning style: ${draft.style}${countryLine}`;

  try {
    const result = await callAI([
      { role: "system", content: sys },
      { role: "user", content: user }
    ], { json: true, maxTokens: 550 });

    const id = "t_" + Date.now();
    const lessons = (result.lessons || []).map((l, i) => ({
      id: l.id || ("l" + i),
      title: l.title,
      prerequisites: Array.isArray(l.prerequisites) ? l.prerequisites : [],
      content: null, quiz: null, done: false
    }));
    sanitizeGraph(lessons); // guards against bad/cyclical AI output soft-locking the curriculum

    state.topics[id] = {
      id,
      title: draft.title.trim(),
      description: result.description ? cleanText(result.description) : "",
      level: draft.level,
      style: draft.style,
      country: draft.country || "",
      createdAt: Date.now(),
      lessons
    };
    await saveTopics();
    state.activeTopicId = id;
    state.view = "curriculum";
    track("topic_created", { topic: draft.title.trim(), level: draft.level, style: draft.style });
    prefetchNextLesson({ ...state.topics[id], id }, null); // starts the first available lesson generating silently while they view the curriculum list
    state.newTopicDraft = { title: "", level: "Beginner", style: "examples", country: draft.country, step: 1 };
  } catch (e) {
    state.error = friendlyError(e);
  }
  state.loading = false;
  render();
}

async function openReviewLesson(topicId) {
  const topic = state.topics[topicId];
  const weakQuestions = (topic.profile?.weak || []).slice(-8).map(w => w.question);
  if (weakQuestions.length === 0) return;

  // Create (or reuse) a special review lesson slot at the end of the lessons array
  let reviewIdx = topic.lessons.findIndex(l => l.isReview);
  if (reviewIdx === -1) {
    topic.lessons.push({ id: "review_" + topic.id, title: "Review: your weak spots", isReview: true, prerequisites: [], content: null, done: false });
    reviewIdx = topic.lessons.length - 1;
  } else {
    topic.lessons[reviewIdx].content = null; // regenerate fresh each time, since weak spots change
  }

  state.activeTopicId = topicId;
  state.activeLessonIndex = reviewIdx;
  state.view = "lesson";
  state.loading = true;
  state.loadingMsg = "Building your review...";
  state.error = null;
  render();

  const sys = `You are a tutor building a short REVIEW lesson that re-teaches specific concepts a learner has been getting wrong, using a fresh angle (different example/analogy than before) so it clicks this time. Output ONLY valid JSON (no markdown fences) with this shape:
{"content_html": "string of simple HTML using <p>,<h3>,<ul>,<li>,<strong>,<em> only", "quiz": [{"question":"string","options":["a","b","c","d"],"correctIndex":0,"explanation":"string"}]}
Keep it short (under 5 minutes to read). Address each concept briefly, then give 2-3 quiz questions re-testing them. Do not use markdown asterisks. Write for a "${topic.level}" learner.`;
  const user = `Topic: ${topic.title}\nConcepts/questions the learner previously missed:\n${weakQuestions.map((q,i) => (i+1)+". "+q).join("\n")}`;

  try {
    const result = await callAI([
      { role: "system", content: sys },
      { role: "user", content: user }
    ], { json: true });
    topic.lessons[reviewIdx].content = result.content_html;
    topic.lessons[reviewIdx].quiz = (result.quiz || []).map(q => ({
      ...q,
      question: cleanText(q.question),
      options: q.options.map(cleanText),
      explanation: cleanText(q.explanation)
    }));
    await saveTopics();
  } catch (e) {
    state.error = friendlyError(e);
  }
  state.loading = false;
  render();
}

  } catch (e) {
    state.error = friendlyError(e);
  }
  state.loading = false;
  render();
}

async function generateLessonContent(topic, lesson, idx) {
  // Prefer lessons actually marked done (accurate even with branching); fall back to
  // simple array-order for the rare case a topic has no completed lessons yet.
  const doneTitles = topic.lessons.filter(l => l.done).map(l => l.title);
  const priorTitles = (doneTitles.length ? doneTitles : topic.lessons.slice(0, idx).map(l => l.title)).join(", ") || "none";
  const countryLine = topic.country ? ` Use examples, references, units, currency, and illustrations relevant to ${topic.country} wherever it naturally fits the topic.` : "";
  const memoryLine = profileSummary(topic);
  // If the topic title alone could be mistaken for something unrelated (e.g. "Raptor 3" —
  // a rocket engine, but also easily read as a sports team), the disambiguated description
  // generated alongside the curriculum keeps searches (and the AI itself) on the right subject.
  const disambiguatedTopic = topic.description ? `${topic.title} (${topic.description})` : topic.title;
  const searchQuery = disambiguatedTopic + " " + lesson.title;

  // Kick off everything independent of the AI text in parallel, instead of waiting on each in sequence.
  const imagePromise = fetchLessonImage(searchQuery);
  const readingPromise = fetchFurtherReading(searchQuery);
  const groundingPromise = fetchWikiExtract(searchQuery); // real current text, used to ground the lesson in facts

  const groundingText = await groundingPromise;
  const groundingLine = groundingText
    ? `\n\nHere is a current, factual reference extract to ground this lesson's facts in (paraphrase, don't copy verbatim, and only use what's actually relevant to this specific lesson):\n"""${groundingText}"""`
    : "";

  const sys = `You are a patient, engaging tutor writing a single self-contained MICRO-LESSON meant to be read in under 5 minutes — think bite-sized daily lesson, not a textbook chapter. Output ONLY valid JSON (no markdown fences) with this shape:
{"content_html": "string of simple HTML using <p>,<h3>,<ul>,<li>,<strong>,<em> only", "quiz": [{"question":"string","options":["a","b","c","d"],"correctIndex":0,"explanation":"string"}], "takeaway": "one sentence capturing the single most important idea from this lesson"}
The content_html should include sections (use <h3> headers), in this order:
1. Introduction — the core idea, plainly stated.
2. An Example — concrete and specific.
3. An Analogy — to make it stick.
4. Perspectives — IMPORTANT: if this topic has more than one scholarly, cultural, or traditional viewpoint (this is especially true for religion, history, philosophy, or any topic where interpretations differ), briefly name 2-3 distinct perspectives side by side and be explicit about which points are broadly agreed upon versus actively debated or interpreted differently across traditions/scholars. Never present one tradition's view as the neutral default. If the topic is genuinely a single-consensus factual matter (e.g. basic arithmetic), this section can instead briefly note that it's well-established and skip straight to Practice.
5. Practice/Summary — a short recap.
Keep each section to 2-4 short sentences — total reading time under 5 minutes even with the Perspectives section included. Write for a "${topic.level}" learner who prefers a "${topic.style}" style.${countryLine}${memoryLine} Include 4 to 5 quiz questions (in the quiz array, not in content_html), covering different parts of the lesson (not all on the same fact) — at least one should test understanding of a perspective/nuance, not just a fact. Keep quiz explanations to one short sentence. Do not use markdown asterisks for bold/italic — use the actual HTML tags instead.${groundingLine}`;
  const user = `Topic: ${disambiguatedTopic}\nLesson: "${lesson.title}"\nLessons already covered: ${priorTitles}`;

  const result = await callAI([
    { role: "system", content: sys },
    { role: "user", content: user }
  ], { json: true, maxTokens: 1100 });

  lesson.content = result.content_html;
  lesson.takeaway = result.takeaway ? cleanText(result.takeaway) : null;
  lesson.quiz = (result.quiz || []).map(q => ({
    ...q,
    question: cleanText(q.question),
    options: q.options.map(cleanText),
    explanation: cleanText(q.explanation)
  }));
  // These were already running in the background during the AI calls above — just collect them now.
  lesson.imageUrl = await imagePromise;
  lesson.furtherReading = await readingPromise;
  await saveTopics();
}

let prefetchInFlight = new Set(); // guards against double-prefetching the same lesson
let prefetchStatus = {}; // "topicId:idx" -> "loading" | "done", purely for the visible indicator
let takeawaySession = null; // in-memory only — { queue, index, flipped, browsing } for the current deck pass

// Silently generates the next lesson in the background while the learner is still
// reading the current one. Never touches loading/error state — if it fails, the
// lesson simply generates normally (visibly) whenever they actually open it.
// currentLessonId: the lesson just opened/finished generating, or null when there's no
// "current" lesson yet (e.g. right after curriculum creation, before any lesson opened).
function prefetchNextLesson(topic, currentLessonId) {
  // Don't spend quota on a lesson nobody asked for yet if we're running low —
  // reserve what's left for lessons/reviews the learner explicitly opens.
  if (state.realRemaining !== null && state.realRemaining <= 10) return;
  const next = chooseNextLesson(topic, currentLessonId);
  if (!next || next.content) return;
  const key = topic.id + ":" + next.id;
  if (prefetchInFlight.has(key)) return;
  const nextIdx = topic.lessons.indexOf(next);
  prefetchInFlight.add(key);
  prefetchStatus[key] = "loading";
  render();
  generateLessonContent(topic, next, nextIdx)
    .then(() => { prefetchStatus[key] = "done"; render(); })
    .catch(() => { delete prefetchStatus[key]; /* will just generate normally on demand later */ })
    .finally(() => prefetchInFlight.delete(key));
}

async function openLesson(topicId, idx) {
  state.activeTopicId = topicId;
  state.activeLessonIndex = idx;
  state.view = "lesson";
  state.error = null;
  const topic = state.topics[topicId];
  topic.lastOpenedIndex = idx;
  topic.lastOpenedAt = Date.now();
  const lesson = topic.lessons[idx];
  if (lesson.skipped) lesson.skipped = false; // opening it is un-skipping it — they're engaging with it now
  saveTopics();
  render();

  if (lesson.content) {
    prefetchNextLesson(topic, lesson.id); // already cached — get a head start on the one after
    return;
  }

  state.loading = true;
  state.loadingMsg = "Writing this lesson...";
  render();

  try {
    await generateLessonContent(topic, lesson, idx);
    prefetchNextLesson(topic, lesson.id); // now that this one's done, quietly start the next
  } catch (e) {
    state.error = friendlyError(e);
  }
  state.loading = false;
  render();
}

function markLessonDone(topicId, idx, wasPerfect) {
  const topic = state.topics[topicId];
  const lesson = topic.lessons[idx];
  lesson.done = true;
  saveTopics();
  track("lesson_completed", { topic: topic.title, lesson: lesson.title });

  const g = state.gamification;
  g.completionLog = [...(g.completionLog || []), Date.now()].slice(-500);
  if (wasPerfect) g.perfectLessons = (g.perfectLessons || 0) + 1;
  if (lesson.isReview || lesson.isDailyReview) g.reviewsCompleted = (g.reviewsCompleted || 0) + 1;
  awardXp(20, "lesson_completed"); // awardXp already saves gamification + checks achievements

  render();
}

// --- FSRS (Free Spaced Repetition Scheduler) ---
// A small, dependency-free implementation of the open FSRS v4.5 algorithm
// (same family used by Anki), adapted for a right/wrong quiz instead of a
// 4-button rating: a correct answer maps to FSRS rating "Good" (3), an
// incorrect one to "Again" (1). Pure math, no API cost, no external library.
const FSRS_W = [0.4072, 1.1829, 3.1262, 15.4722, 7.2102, 0.5316, 1.0651, 0.0234, 1.616, 0.1544, 1.0824, 1.9813, 0.0953, 0.2975, 2.2042, 0.2407, 2.9466, 0.5034, 0.6567];
const FSRS_DECAY = -0.5;
const FSRS_FACTOR = 19 / 81;
const DAY_MS = 24 * 60 * 60 * 1000;

// Probability of still remembering, given days elapsed and current stability.
function fsrsRetrievability(elapsedDays, stability) {
  return Math.pow(1 + FSRS_FACTOR * elapsedDays / stability, FSRS_DECAY);
}
function fsrsInitialStability(rating) {
  return Math.max(0.1, FSRS_W[rating === 3 ? 2 : 0]);
}
function fsrsInitialDifficulty(rating) {
  return Math.min(10, Math.max(1, FSRS_W[4] - (rating - 3) * FSRS_W[5]));
}
function fsrsNextDifficulty(d, rating) {
  const dPrime = d + (-FSRS_W[6] * (rating - 3)) * ((10 - d) / 9);
  const target = fsrsInitialDifficulty(3); // mean-reverts gently toward the "Good" baseline
  return Math.min(10, Math.max(1, FSRS_W[7] * target + (1 - FSRS_W[7]) * dPrime));
}
function fsrsNextStability(d, s, r, rating) {
  if (rating === 1) {
    // wrong answer ("lapse") — interval shrinks based on current difficulty/stability
    return Math.max(0.1, FSRS_W[11] * Math.pow(d, -FSRS_W[12]) * (Math.pow(s + 1, FSRS_W[13]) - 1) * Math.exp((1 - r) * FSRS_W[14]));
  }
  // correct answer — interval grows, more so if it was recalled after a longer gap
  return s * (1 + Math.exp(FSRS_W[8]) * (11 - d) * Math.pow(s, -FSRS_W[9]) * (Math.exp((1 - r) * FSRS_W[10]) - 1));
}
// Given a question's existing FSRS state (or none, for a fresh item) and whether
// this answer was correct, returns the updated { stability, difficulty, reps, lapses, dueAt }.
function fsrsUpdate(item, wasCorrect, now) {
  const rating = wasCorrect ? 3 : 1;
  if (!item || !item.stability) {
    const stability = fsrsInitialStability(rating);
    const difficulty = fsrsInitialDifficulty(rating);
    return { stability, difficulty, reps: 1, lapses: wasCorrect ? 0 : 1, dueAt: now + stability * DAY_MS };
  }
  const elapsedDays = Math.max(0, (now - (item.at || now)) / DAY_MS);
  const r = fsrsRetrievability(elapsedDays, item.stability);
  const difficulty = fsrsNextDifficulty(item.difficulty, rating);
  const stability = fsrsNextStability(item.difficulty, item.stability, r, rating);
  return {
    stability, difficulty,
    reps: (item.reps || 0) + 1,
    lapses: (item.lapses || 0) + (wasCorrect ? 0 : 1),
    dueAt: now + stability * DAY_MS
  };
}

// Records right/wrong answers per topic so future lessons and chat can reinforce weak areas,
// and keeps each question's FSRS scheduling state up to date.
// Backward compatible: old saved topics won't have this field, or FSRS fields on existing
// entries, until their first new answer — no migration needed, they just start fresh then.
function recordQuizAnswer(topicId, lessonTitle, question, wasCorrect) {
  const topic = state.topics[topicId];
  if (!topic.profile) topic.profile = { weak: [], strong: [] };
  const now = Date.now();

  if (wasCorrect) {
    // if they'd previously missed this same question, clear it from weak list — they've got it now
    topic.profile.weak = topic.profile.weak.filter(w => w.question !== question);
  } else if (!topic.profile.weak.some(w => w.question === question)) {
    topic.profile.weak.push({ lesson: lessonTitle, question, at: now });
  }
  topic.profile.weak = topic.profile.weak.slice(-15);

  // "strong" now holds one evolving FSRS tracking entry per question (not a growing
  // history log) so we can compute a real due date instead of a flat 3-day timer.
  const existing = topic.profile.strong.find(s => s.question === question);
  const fsrs = fsrsUpdate(existing, wasCorrect, now);
  if (existing) {
    Object.assign(existing, { lesson: lessonTitle, at: now, ...fsrs });
  } else {
    topic.profile.strong.push({ lesson: lessonTitle, question, at: now, ...fsrs });
    if (topic.profile.strong.length > 60) topic.profile.strong = topic.profile.strong.slice(-60); // cap unbounded growth
  }
  saveTopics();
}

// Turns a topic's tracked performance into a short line for AI prompts.
function profileSummary(topic) {
  const p = topic.profile;
  if (!p || (p.weak.length === 0 && p.strong.length === 0)) return "";
  const weakLine = p.weak.length
    ? `The learner has struggled with: ${p.weak.slice(-6).map(w => w.question).join("; ")}. Reinforce these concepts naturally where relevant, without calling out that they got them wrong before.`
    : "";
  const paceLine = p.strong.length >= 4 && p.weak.length === 0
    ? " This learner has been answering confidently — feel free to move a bit faster and go slightly deeper."
    : "";
  return " " + weakLine + paceLine;
}

function weakConceptTitles(topic) {
  if (!topic.profile || !topic.profile.weak.length) return [];
  // unique lesson titles that have an open weak spot
  return [...new Set(topic.profile.weak.map(w => w.lesson))];
}

// Spaced repetition: each question has its own FSRS-computed due date (see fsrsUpdate
// above) instead of a flat "3 days for everyone" timer — well-known/easy items drift
// out further, shaky ones come back sooner.
function dueForReview(topic) {
  const p = topic.profile;
  if (!p || !p.strong.length) return [];
  const now = Date.now();
  return p.strong
    .filter(s => s.dueAt && s.dueAt < now)
    .sort((a, b) => a.dueAt - b.dueAt) // most overdue first
    .slice(0, 8);
}
function anyTopicDueForReview() {
  return Object.values(state.topics).find(t => dueForReview(t).length > 0) || null;
}

// Personal takeaway deck (see fsrsUpdate above for the shared scheduling engine).
// Each lesson's one-sentence takeaway is its own spaced-repetition item, tracked
// on the lesson itself (lesson.takeawayReview) so it rides along with normal sync
// — no separate storage, no schema change needed on the server.
function allTakeaways() {
  const out = [];
  Object.values(state.topics).forEach(t => {
    (t.lessons || []).forEach((l, idx) => {
      if (l.takeaway) out.push({ topicId: t.id, topicTitle: t.title, lessonIdx: idx, lessonTitle: l.title, takeaway: l.takeaway, review: l.takeawayReview });
    });
  });
  return out;
}
function dueTakeaways() {
  const now = Date.now();
  return allTakeaways()
    .filter(t => !t.review || !t.review.dueAt || t.review.dueAt < now)
    .sort((a, b) => (a.review?.dueAt || 0) - (b.review?.dueAt || 0));
}
function recordTakeawayReview(topicId, lessonIdx, gotIt) {
  const lesson = state.topics[topicId].lessons[lessonIdx];
  lesson.takeawayReview = fsrsUpdate(lesson.takeawayReview, gotIt, Date.now());
  saveTopics();
}

async function sendChat(topicId, idx, text, quickAction) {
  const key = topicId + ":" + idx;
  if (!state.chatByLesson[key]) state.chatByLesson[key] = [];
  const log = state.chatByLesson[key];
  const userText = quickAction || text;
  if (!userText.trim()) return;
  log.push({ role: "user", text: userText });
  state.loading = true;
  state.loadingMsg = "Thinking...";
  state.error = null;
  render();

  const topic = state.topics[topicId];
  const lesson = topic.lessons[idx];
  const countryLine = topic.country ? ` Where helpful, use examples relevant to ${topic.country}.` : "";
  const disambiguatedTopic = topic.description ? `${topic.title} (${topic.description})` : topic.title;
  const sys = `You are a friendly tutor helping a learner with the lesson "${lesson.title}" (topic: ${disambiguatedTopic}, level: ${topic.level}). The lesson content was:\n${stripHtml(lesson.content).slice(0,1500)}\nAnswer the learner's question or request concisely and clearly, matching their level.${countryLine} Write in short paragraphs (2-4 sentences each), separated by a blank line, so it's easy to read on a phone. Plain text only, no markdown asterisks, no bullet symbols, no fences.`;

  const history = log.slice(-6).map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.text }));

  try {
    const reply = await callAI([
      { role: "system", content: sys },
      ...history
    ], { maxTokens: 400 });
    log.push({ role: "ai", text: cleanText(reply) });
  } catch (e) {
    state.error = friendlyError(e);
    log.pop(); // remove the unanswered user message from view? keep it but show error
    log.push({ role: "user", text: userText, failed: true });
  }
  state.loading = false;
  render();
}

async function fetchLessonImage(query) {
  try {
    const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&generator=search&gsrsearch=" +
      encodeURIComponent(query) + "&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=600&origin=*";
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const pages = data?.query?.pages;
    if (!pages) return null;
    const first = Object.values(pages)[0];
    return first?.thumbnail?.source || null;
  } catch (e) {
    return null; // images are a nice-to-have, never block the lesson on this
  }
}

// Real, verifiable further-reading links — not AI-generated, so never hallucinated.
async function fetchFurtherReading(query, limit = 3) {
  try {
    const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&generator=search&gsrsearch=" +
      encodeURIComponent(query) + "&gsrlimit=" + limit + "&prop=info&inprop=url&origin=*";
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    const pages = data?.query?.pages;
    if (!pages) return [];
    return Object.values(pages)
      .map(p => ({ title: p.title, url: p.fullurl }))
      .filter(p => p.url);
  } catch (e) {
    return []; // never block the lesson on this
  }
}

// Free, keyless way to ground lesson generation in real, current text instead of
// relying purely on the model's training memory. Not live search, but far fresher
// and fact-checkable than nothing — Wikipedia is edited constantly.
// Live topic suggestions as you type — free, keyless, real (Wikipedia's own search-as-you-type API).
async function fetchTopicSuggestions(query, limit = 6) {
  try {
    const url = "https://en.wikipedia.org/w/api.php?action=opensearch&format=json&limit=" + limit +
      "&search=" + encodeURIComponent(query) + "&origin=*";
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    return data[1] || []; // opensearch returns [query, [titles], [descriptions], [urls]]
  } catch (e) {
    return [];
  }
}

async function fetchWikiExtract(query, maxChars = 900) {
  try {
    const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&generator=search&gsrsearch=" +
      encodeURIComponent(query) + "&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&origin=*";
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const pages = data?.query?.pages;
    if (!pages) return null;
    const extract = Object.values(pages)[0]?.extract;
    if (!extract) return null;
    return extract.slice(0, maxChars);
  } catch (e) {
    return null; // grounding is a nice-to-have, lesson still generates from model knowledge without it
  }
}

function stripHtml(html) {
  const d = document.createElement("div");
  d.innerHTML = html || "";
  return d.textContent || "";
}

// Audio lesson mode — free, zero API cost, built into every modern browser.
// Voice quality/selection depends entirely on the device (nothing we control).
function toggleLessonAudio(lesson, listenBtn, stopBtn) {
  if (!window.speechSynthesis) { alert("Your browser doesn't support text-to-speech."); return; }
  const synth = window.speechSynthesis;
  if (synth.speaking && !synth.paused) {
    synth.pause();
    listenBtn.textContent = "▶ Resume";
    return;
  }
  if (synth.paused) {
    synth.resume();
    listenBtn.textContent = "⏸ Pause";
    return;
  }
  const utterance = new SpeechSynthesisUtterance(stripHtml(lesson.content));
  utterance.onend = () => { listenBtn.textContent = "🔊 Listen to this lesson"; stopBtn.style.display = "none"; };
  utterance.onerror = () => { listenBtn.textContent = "🔊 Listen to this lesson"; stopBtn.style.display = "none"; };
  synth.speak(utterance);
  listenBtn.textContent = "⏸ Pause";
  stopBtn.style.display = "inline-block";
}

function friendlyError(e) {
  const msg = (e && e.message) || "";
  const low = msg.toLowerCase();
  if (low.includes("email_not_verified")) {
    return "Please verify your email before generating lessons — check your inbox (and spam folder) for the link, or resend it from the account screen.";
  }
  if (low.includes("429") || low.includes("rate")) {
    return "Hit the free-tier rate limit on OpenRouter. Wait a bit and try again — nothing was lost, your progress is saved.";
  }
  if (low.includes("404") || low.includes("not available for free") || low.includes("402")) {
    return "All the free models tried were temporarily unavailable. This usually resolves within a minute or two — try again shortly.";
  }
  if (low.includes("failed to fetch") || low.includes("load failed") || low.includes("networkerror")) {
    return "Couldn't reach the server (network error: \"" + msg.slice(0,100) + "\"). If this keeps happening on one specific device/browser, that detail helps track it down.";
  }
  return "Something went wrong reaching the AI (" + msg.slice(0,120) + "). Your progress is saved — try again in a moment.";
}

}

      : `~${remaining} of ~${ASSUMED_BUDGET} AI exchanges left today (estimate until your first request this session) · lessons are cached once generated, so revisiting them is free`)
  ]));

  if (state.error) {
    root.appendChild(el("div", { class: "error-box" }, state.error));
  }

  if (state.session && state.session.emailVerified === false && state.view !== "account") {
    const banner = el("div", { class: "error-box", style: "background:#fff8e6;border-color:var(--clay);color:#6b4e17;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;" }, [

        el("button", { class: "btn-ghost", style: "font-size:11px;padding:5px 10px;" }, "Resend")
      ])
    ]);
    const [refreshBtn, resendBtn] = banner.lastChild.children;
    refreshBtn.addEventListener("click", async () => {
      refreshBtn.textContent = "Checking...";
      await refreshVerificationStatus();
      if (state.session && state.session.emailVerified) return; // render() inside refresh already updates the view, banner will be gone
      refreshBtn.textContent = "I've verified";
    });
    resendBtn.addEventListener("click", async () => {
      resendBtn.textContent = "Sending...";
      try { await resendVerification(); resendBtn.textContent = "Sent!"; }
      catch (e) { resendBtn.textContent = "Resend"; state.error = e.message; render(); }
    });
    root.appendChild(banner);
  }

  if (state.loading) {
    root.appendChild(el("div", { class: "loading-skel" }, [
      el("div", { class: "spinner" }),
      el("span", {}, state.loadingMsg)
    ]));
  }

  if (state.view === "home") root.appendChild(HomeView());
  if (state.view === "new") root.appendChild(NewTopicView());
  if (state.view === "curriculum") root.appendChild(CurriculumView());
  if (state.view === "lesson") root.appendChild(LessonView());
  if (state.view === "account") root.appendChild(AccountView());
  if (state.view === "achievements") root.appendChild(AchievementsView());
  if (state.view === "takeaways") root.appendChild(TakeawayDeckView());
  if (state.view === "intro") root.appendChild(IntroView());
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) {
    if (k === "class") e.className = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  if (typeof children === "string") e.textContent = children;
  else if (Array.isArray(children)) children.forEach(c => c && e.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  else if (children instanceof Node) e.appendChild(children);
  return e;
}
